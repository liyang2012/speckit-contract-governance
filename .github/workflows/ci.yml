name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: false
      - run: python -m pip install PyYAML
      - name: Install pinned Spec Kit
        run: |
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@v0.16.2
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Bash syntax
        run: bash -n scripts/bash/*.sh
      - name: Bash smoke suite
        run: bash scripts/bash/test-smoke.sh
      - name: Python analyzer tests
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/python/test_contract_analyzer.py -v
      - name: Distribution validation
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/python/validate_distribution.py
      - name: Spec Kit 0.16.2 compatibility smoke
        run: bash scripts/bash/test-speckit-0162.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - name: PowerShell smoke suite
        shell: pwsh
        run: ./scripts/powershell/test-smoke.ps1
